name: Android 앱 만들기

# site/ 의 화면과 app/ 의 안드로이드 설정이 바뀌면 자동으로 앱 파일을 만들어요.
#  - 시험용 APK: 폰에 직접 설치해서 써볼 수 있어요 (항상 만들어요)
#  - 출시용 AAB: 구글 플레이에 올리는 파일이에요 (서명 정보를 등록한 뒤부터 만들어요)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/data/**'   # 매일 바뀌는 해설 데이터는 앱이 인터넷에서 직접 받아와서, 앱을 다시 만들 필요가 없어요
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write   # 시험용 APK 를 '릴리스'로 올려 폰에서 바로 내려받게 하려고 필요해요

jobs:
  build:
    name: APK / AAB 만들기
    # 도구 버전이 몰래 바뀌지 않도록 컴퓨터 종류를 고정해요 (ubuntu-latest 는 10월 19일부터 우분투 26 으로 바뀐대요)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 이 컴퓨터에는 안드로이드 SDK 가 미리 깔려 있어요. 빠진 것만 채워요.
      - name: 안드로이드 도구 점검
        run: bash scripts/ci-run.sh "안드로이드 도구 점검" -- bash scripts/ci-android-sdk.sh

      - name: 콘텐츠 검사
        run: node scripts/content.mjs validate

      - name: 웹 화면을 앱 폴더로 복사
        run: |
          rm -rf app/www
          mkdir -p app/www
          cp -R site/. app/www/

      - name: npm 패키지 설치
        working-directory: app
        run: ../scripts/ci-run.sh "npm 설치" -- npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 만들기
        working-directory: app
        run: ../scripts/ci-run.sh "cap add android" -- npx cap add android

      - name: 우리 앱에 맞게 고치기
        working-directory: app
        run: ../scripts/ci-run.sh "android 고치기" -- node scripts/patch-android.mjs

      - name: 아이콘과 시작 화면 만들기
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3347FF' --splashBackgroundColor '#F2F4F8'

      - name: 앱에 화면 반영하기
        working-directory: app
        run: ../scripts/ci-run.sh "cap sync" -- npx cap sync android

      # 시험용 서명 키(디버그 키)는 빌드 때마다 새로 만들어져서, 그대로 두면 폰에서 '덮어 설치'가 안 돼요.
      # 키 파일을 캐시에 두고 계속 같은 키로 서명해요. (비밀 키가 아니에요. 정식 출시용 키는 따로 GitHub Secrets 에만 둬요.)
      - name: 시험용 서명 키 불러오기
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/whyttuji-debug.keystore
          key: debug-keystore-v2

      - name: 시험용 서명 키 준비
        run: |
          ks="$HOME/whyttuji-debug.keystore"
          if [ ! -s "$ks" ]; then
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "WHYTTUJI_DEBUG_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: 시험용 APK 만들기
        working-directory: app/android
        run: |
          chmod +x gradlew
          ../../scripts/ci-run.sh "APK 빌드" -- ./gradlew assembleDebug --no-daemon --stacktrace

      # 만들어진 APK 안에 AdMob ID·권한·목표 SDK 가 제대로 들어갔는지 확인해요. (빠지면 여기서 멈춰요)
      - name: APK 안쪽 점검
        env:
          KEY_CACHE_HIT: ${{ steps.keycache.outputs.cache-hit }}
        run: bash scripts/ci-run.sh "APK 점검" -- bash scripts/ci-apk-check.sh

      - name: 시험용 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: whyttuji-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 폰에서 링크 하나로 내려받아 설치해 볼 수 있게 해요. (로그인 없이 받을 수 있어요)
      # 주소: https://github.com/<저장소>/releases/download/test-latest/whyttuji-test.apk
      - name: 시험용 APK 를 내려받기 쉽게 올리기
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls app/android/app/build/outputs/apk/debug/*.apk | head -n 1)"
          cp "$APK" whyttuji-test.apk
          gh release delete test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create test-latest whyttuji-test.apk \
            --title "왜뜨지 시험용 앱 (최신)" \
            --notes "폰에 바로 설치해 써볼 수 있는 시험용 앱이에요. 광고는 구글 테스트 광고만 나와요. 정식 출시용이 아니에요. (빌드 ${{ github.run_number }}, 커밋 ${GITHUB_SHA::7})" \
            --prerelease --target "$GITHUB_SHA"

      - name: 서명 정보가 등록돼 있는지 확인
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=출시용 AAB 는 건너뛰었어요::서명 정보(KEYSTORE_BASE64 등)가 아직 등록되지 않았어요. 구글 플레이에 올릴 때 등록해요."
          fi

      - name: 출시용 AAB 만들고 서명하기
        if: steps.ks.outputs.has == 'true'
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ../../scripts/ci-run.sh "AAB 빌드" -- ./gradlew bundleRelease --no-daemon --stacktrace
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: 출시용 AAB 올리기
        if: steps.ks.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whyttuji-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
