name: Android 앱 만들기

# site/ 의 화면과 app/ 의 안드로이드 설정이 바뀌면 자동으로 앱 파일을 만들어요.
#  - 시험용 APK: 폰에 직접 설치해서 써볼 수 있어요 (항상 만들어요)
#  - 출시용 AAB: 구글 플레이에 올리는 파일이에요 (서명 정보를 등록한 뒤부터 만들어요)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: APK / AAB 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 콘텐츠 검사
        run: node scripts/content.mjs validate

      - name: 웹 화면을 앱 폴더로 복사
        run: |
          rm -rf app/www
          mkdir -p app/www
          cp -R site/. app/www/

      - name: npm 패키지 설치
        working-directory: app
        run: ../scripts/ci-run.sh "npm 설치" -- npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 만들기
        working-directory: app
        run: ../scripts/ci-run.sh "cap add android" -- npx cap add android

      - name: 우리 앱에 맞게 고치기
        working-directory: app
        run: ../scripts/ci-run.sh "android 고치기" -- node scripts/patch-android.mjs

      - name: 아이콘과 시작 화면 만들기
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3347FF' --splashBackgroundColor '#F2F4F8'

      - name: 앱에 화면 반영하기
        working-directory: app
        run: ../scripts/ci-run.sh "cap sync" -- npx cap sync android

      - name: 시험용 APK 만들기
        working-directory: app/android
        run: |
          chmod +x gradlew
          ../../scripts/ci-run.sh "APK 빌드" -- ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 시험용 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: whyttuji-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 서명 정보가 등록돼 있는지 확인
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=출시용 AAB 는 건너뛰었어요::서명 정보(KEYSTORE_BASE64 등)가 아직 등록되지 않았어요. 구글 플레이에 올릴 때 등록해요."
          fi

      - name: 출시용 AAB 만들고 서명하기
        if: steps.ks.outputs.has == 'true'
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ../../scripts/ci-run.sh "AAB 빌드" -- ./gradlew bundleRelease --no-daemon --stacktrace
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: 출시용 AAB 올리기
        if: steps.ks.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whyttuji-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
