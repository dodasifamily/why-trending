name: 웹 사이트 올리기 (GitHub Pages)

# site/ 폴더가 바뀔 때마다 웹 사이트를 새로 올려요.
# 앱도 이 주소에서 매일의 최신 해설(data/today.json)을 받아가요.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/content.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      retry_videos:
        description: '영상을 못 찾았던 카드도 6시간을 기다리지 않고 바로 다시 찾아요 (유튜브 검색 한도를 써요)'
        type: boolean
        default: false
  # 매일 한국 시간 06:30 (해설 갱신 40분 뒤)에 한 번 더 올려요. 갱신 때 올리기를 놓쳤거나,
  # Pages 를 나중에 켠 경우에도 하루 안에 저절로 사이트가 올라가요.
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 컴퓨터 종류를 고정해요 (ubuntu-latest 는 10월 19일부터 우분투 26 으로 바뀐대요)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 콘텐츠 검사 (규칙을 어기면 올리지 않아요)
        run: node scripts/content.mjs validate

      # 앱 첫 화면의 분야별 목록과 검색 화면은 오늘 해설과 이 파일들을 합쳐 만들어요. 올릴 때마다 사전(terms.json)에서 새로 만들고, 저장소에는 두지 않아요.
      #  - recent.json: 오늘 기준 2일 전까지(최근 3일) 이슈
      #  - archive.json: 분야를 적게 고른 사람에게 더 오래된 이슈까지 보여주려는 지난 이슈 보관함
      - name: 최근 3일·지난 이슈 목록 만들기
        run: node scripts/content.mjs recent

      # 영상 자동 찾기 기록(어느 카드에 어떤 영상을 붙였는지, 못 찾은 카드는 언제 찾아봤는지)을 이어 써요.
      # 유튜브가 하루 무료 검색을 100번으로 제한해서, 같은 카드를 올릴 때마다 다시 검색하지 않으려고 해요.
      - name: 영상 찾기 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .cache/video-picks.json
          key: video-picks-${{ github.run_id }}
          restore-keys: |
            video-picks-

      # 영상이 없는 카드에 이번 소식을 다룬 영상을 유튜브 검색으로 찾아 붙여요. 올리는 사이트에만 붙이고, 저장소의 해설 글은 그대로예요.
      # 저장소 Settings → Secrets and variables → Actions 에 YOUTUBE_API_KEY 가 없으면 건너뛰어요. 이 단계가 실패해도 사이트는 올라가요.
      - name: 영상 자동 찾기 (유튜브 검색 키가 있을 때만)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIND_VIDEOS_RETRY: ${{ inputs.retry_videos && '1' || '' }}
        run: node scripts/content.mjs find-videos --write

      - name: 영상 찾기 기록 저장
        if: always() && hashFiles('.cache/video-picks.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/video-picks.json
          key: video-picks-${{ github.run_id }}

      # 해설에 붙인 유튜브 영상이 지워졌거나 다른 곳에서 재생이 막혔다면, 그 영상만 빼고 올려요(해설 글은 그대로 올라가요).
      # 유튜브에 물어볼 수 없는 상황이면 아무것도 빼지 않고 건너뛰어요. 이 단계가 실패해도 사이트는 올라가요.
      - name: 영상 확인 (재생이 안 되는 영상은 빼고 올리기)
        continue-on-error: true
        run: node scripts/content.mjs verify-media --prune

      - name: GitHub Pages 가 켜져 있는지 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages 가 아직 꺼져 있어요::저장소 Settings → Pages → Build and deployment 의 Source 를 'GitHub Actions' 로 바꾸면, 다음 실행부터 사이트가 올라가요."
          fi

      - name: Pages 설정
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: 사이트 파일 묶기
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 사이트 올리기
        id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
