name: 아침 알림 보내기 (FCM)

# 매일 아침 7시·8시·9시(한국 시간, 실제로는 7분 뒤)에, '그 시각을 고른 기기'에 알림을 1개 보내요 (분야별로 나누지 않아요).
#  - 제목은 '오늘 뜨는 소식 N개', 내용은 서로 다른 분야의 대표 소식 2개 + 나머지 개수예요. 누르면 앱 첫 화면이 열려요.
#  - 오늘 해설이 올라오지 않았으면 보내지 않아요 (지난 해설로 '새 해설' 알림을 보내지 않아요).
#  - Firebase 서비스 계정 키(FCM_SERVICE_ACCOUNT_JSON)가 GitHub Secrets 에 등록되기 전에는 아무것도 하지 않고 끝나요.
#  - 직접 해 보려면 Actions 탭에서 '알림 보내기'를 눌러요 (받는 시각을 고르고, 처음에는 '보내지 않고 내용만 보기' 로 확인해요).
#  - 시험 보내기: ops/push-now.json 을 바꾼 커밋이 main 에 올라오면 그 파일에 적힌 대로 보내요 (예: {"hours":[8], "dry_run": false}).
#    dry_run 을 false 로 분명히 적지 않으면 보내지 않고 내용만 보여줘요. 저장소에 쓰기 권한이 있는 사람만 올릴 수 있어요.
#    {"validate_only": true} 를 더하면 FCM 에 '검사만' 부탁하고(기기에는 안 가요), {"use_latest": true} 를 더하면 오늘 해설이 아직 없는
#    자정~아침에도 저장소에 올라와 있는 가장 최근 해설로 시험해요.
# 보내는 방법과 규칙은 scripts/push.mjs 에 있어요.

on:
  schedule:
    # 정각(분 0)에는 예약 실행이 크게 밀리는 일이 많아서 7분에 맞춰요
    - cron: '7 22 * * *'   # 한국 시간 07:07
    - cron: '7 23 * * *'   # 한국 시간 08:07
    - cron: '7 0 * * *'    # 한국 시간 09:07
  push:
    branches: [main]
    paths:
      - 'ops/push-now.json'
  workflow_dispatch:
    inputs:
      hour:
        description: '받는 시각 (7, 8, 9 중 하나)'
        required: true
        default: '8'
      dry_run:
        description: '보내지 않고 내용만 보기 (true 또는 false)'
        required: true
        default: 'true'

permissions:
  contents: read

concurrency:
  group: push-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  send:
    # 이 저장소에서만 보내요 (복제본이 실수로 보내지 않게)
    if: github.repository == 'dodasifamily/why-trending'
    name: 알림 보내기
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 알림 보내기
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          # 앱에 넣은 Firebase 설정도 넘겨서, 서비스 계정 키와 같은 프로젝트인지 확인해요 (다르면 알림이 기기에 닿지 않아요). 값은 출력하지 않아요.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          # 예약 실행은 어느 시각 알림인지 예약 시각으로 정해요 (07:07 → 7, 08:07 → 8, 09:07 → 9)
          HOUR: ${{ github.event_name == 'workflow_dispatch' && inputs.hour || github.event.schedule == '7 22 * * *' && '7' || github.event.schedule == '7 23 * * *' && '8' || '9' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # 예약 실행은 해설 갱신이 조금 늦어도 기다려요 (최대 25분). 직접 누른 실행·시험 보내기는 기다리지 않아요.
          WAIT_MIN: ${{ github.event_name == 'schedule' && '25' || '0' }}
          # 시험 보내기(파일을 올린 커밋)일 때는 이 파일이 시각·보낼지 여부를 정해요
          PUSH_FILE: ${{ github.event_name == 'push' && 'ops/push-now.json' || '' }}
        run: node scripts/push.mjs
